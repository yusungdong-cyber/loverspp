const state={page:'explore',mode:'clinic',station:'jamsil',anchor:null,query:'',specialty:'all',filters:new Set(['clinic','stay','hair','beauty','activity']),selected:null,modal:null,toast:null,consultDemoCount:0,consultStatus:'',clicks:[],eventlog:[],demoCommissions:0,lang:'en',plan:null,planPrefs:{prompt:'I want a skin clinic near Gangnam Station. 4 nights, around ₩1,000,000 including a stay and airport transfer. Find a hotel within 10 minutes on foot.',station:'gangnam',specialty:'derma',budget:1000000,nights:4,walk:10,people:1,includeMedical:false,includeTransfer:true,includeBeauty:false}};
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function t(en,ko){return state.lang==='ko'?ko:en;}
function stationName(id){let o=STATIONS.find(x=>x.id===id);return o?(state.lang==='ko'?o.ko:o.en):'';}
function placeName(p){return state.lang==='ko'&&p.ko?p.ko:p.name;}
function find(id){return ALL.find(p=>p.id===id);}
function icon(type){return ({clinic:'✚',stay:'🛏',hair:'✂',beauty:'✿',activity:'◈'})[type]||'⌖';}
function typeLabel(p){if(p.type==='clinic')return ({dental:t('Dental clinic','치과'),derma:t('Dermatology','피부과'),plastic:t('Plastic surgery','성형외과')})[p.specialty]||t('Clinic','병원');return ({stay:t('Stay','숙소'),hair:t('Hair salon','헤어샵'),beauty:t('Beauty','뷰티'),activity:t('Experience','체험')})[p.type]||p.type;}
function amount(n){return '₩'+Math.round(n).toLocaleString('en-US');}
function calcDist(a,b){let dx=(a.x-b.x)*25.5,dy=(a.y-b.y)*22.5;let m=Math.max(80,Math.round(Math.sqrt(dx*dx+dy*dy)*1.2/20)*20);return {m,walk:Math.max(2,Math.ceil(m/75)),drive:Math.max(3,Math.ceil(m/220)+2)};}
function eventLog(type,info){state.eventlog.unshift({type,info,time:new Date().toLocaleTimeString()});state.eventlog=state.eventlog.slice(0,18);}
function setPage(page){state.page=page;state.modal=null;updateHash();render();window.scrollTo({top:0,behavior:'instant'});}
function updateHash(){let p=new URLSearchParams();p.set('page',state.page);p.set('mode',state.mode);p.set('station',state.station);if(state.anchor)p.set('anchor',state.anchor);try{history.replaceState({},'',location.pathname+location.search+'#'+p.toString())}catch(e){/* about:blank and some embedded previews disallow history state */}}
function initHash(){try{let q=new URLSearchParams(location.hash.slice(1));let st=q.get('station'),mo=q.get('mode'),p=q.get('page'),an=q.get('anchor');if(STATIONS.find(x=>x.id===st))state.station=st;if(['clinic','stay'].includes(mo))state.mode=mo;if(['explore','consult','planner','partners','admin','about'].includes(p))state.page=p;if(find(an)&&find(an).station===state.station)state.anchor=an;}catch(e){}}
function toast(msg){state.toast=msg;let n=document.getElementById('toast');if(n)n.remove();let el=document.createElement('div');el.id='toast';el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{if(document.getElementById('toast')===el)el.remove()},3600);}
function setAnchor(id){let p=find(id);if(!p)return;state.anchor=id;state.station=p.station;state.selected=id;eventLog('anchor_selected',placeName(p));updateHash();render();}
function setStation(id){if(!STATIONS.find(x=>x.id===id))return;state.station=id;state.anchor=null;state.selected=null;eventLog('search_submitted',stationName(id));updateHash();render();}
function setMode(m){state.mode=m;state.anchor=null;state.selected=null;state.specialty='all';updateHash();render();}
function items(){return ALL.filter(p=>p.station===state.station)}
function baseResults(){let arr=items().filter(p=>state.mode==='clinic'?p.type==='clinic':p.type==='stay');if(state.specialty!=='all'&&state.mode==='clinic')arr=arr.filter(p=>p.specialty===state.specialty);if(state.query.trim())arr=arr.filter(p=>(p.name+' '+(p.ko||'')+' '+typeLabel(p)).toLowerCase().includes(state.query.toLowerCase()));arr.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));return arr;}
function neighbors(){let a=find(state.anchor);if(!a)return[];return items().filter(x=>x.id!==a.id&&state.filters.has(x.type)).map(p=>({p,dist:calcDist(a,p)})).sort((x,y)=>x.dist.walk-y.dist.walk);}
function searchSelect(){return `<select id="stationSelect" class="field" aria-label="Station">${STATIONS.map(s=>`<option value="${s.id}" ${state.station===s.id?'selected':''}>📍 ${state.lang==='ko'?s.ko:s.en}</option>`).join('')}</select>`}
function wordmark(){return `<div class="brand"><div class="brand-mark">✦</div>BeautyPass<span style="font-size:9px;letter-spacing:.09em;background:#f0f5ff;color:#4972d7;padding:5px 7px;border-radius:5px;margin-left:2px">DEMO</span></div>`}
function renderTop(){let tabs=[['explore','Explore'],['consult','Free Consultation'],['planner','AI Trip Planner'],['partners','Travel Partners'],['about','How it works']];return `<header class="topbar">${wordmark()}<nav class="topnav">${tabs.map(([id,label])=>`<button class="navitem ${state.page===id?'active':''}" data-page="${id}">${label}</button>`).join('')}</nav><div class="topactions"><button class="langbtn" id="langToggle">${state.lang==='en'?'🇺🇸 EN':'🇰🇷 KR'} ▾</button><button class="outlinebtn sm" data-page="admin">⚙ ${t('Admin demo','관리자 데모')}</button><button class="primarybtn sm" data-page="consult">${t('Free consultation','무료 상담')}</button></div></header>`}
function sidebar(){let a=[['explore','⌕',t('Discover','탐색하기')],['consult','✚',t('Clinics & consultation','병원·상담')],['planner','✧',t('AI trip planner','AI 여행 설계')],['partners','🛏',t('Stays & booking','숙박·예약')],['partners','✈',t('Airport transfers','공항 픽업')],['partners','✿',t('Beauty & experiences','뷰티·체험')]];return `<aside class="sidebar"><div class="sidelabel">${t('SERVICES','서비스')}</div>${a.map(([id,ic,l])=>`<button class="sideitem ${state.page===id?'active':''}" data-page="${id}"><span style="font-size:19px;width:23px;text-align:center">${ic}</span><span>${l}</span></button>`).join('')}<div class="sideseparator"></div><button class="sideitem ${state.page==='admin'?'active':''}" data-page="admin"><span style="font-size:18px;width:23px">▦</span><span>${t('Admin preview','관리자 미리보기')}</span></button><div class="sidefooter"><strong>INTERACTIVE PROTOTYPE</strong>${t('Demo locations, simulated walking estimates and sample budgets. No live booking or patient data.','예시 장소·도보시간·예산. 실제 예약이나 의료자료는 처리하지 않습니다.')}</div></aside>`}
function hero(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">SEOUL MEDICAL · BEAUTY · TRAVEL</div><h1>${t('Choose a clinic. Your travel plan comes together automatically.','병원만 선택하세요. 여행 계획은 자동 완성됩니다.')}</h1><p>${t('Free pre-travel clinic consultation, nearby stays, walking distances and an AI-planned Seoul itinerary — all in one place.','여행 전 무료 상담부터 주변 숙소·도보 거리·AI 여행 계획까지 한 번에.')}</p><div class="herobtns"><button class="whitebtn" data-page="planner">✧ ${t('Plan my Seoul trip','AI 여행 설계')}</button><button class="glassbtn" data-page="consult">✚ ${t('Get a free clinic consultation','무료 병원 상담')}</button></div></div><div class="hero-scene"><svg viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="289" cy="145" r="151" fill="white" fill-opacity=".08"/><circle cx="289" cy="145" r="108" stroke="white" stroke-opacity=".2" stroke-width="2" stroke-dasharray="5 9"/><path d="M5 240h474" stroke="white" stroke-opacity=".24" stroke-width="3"/><g fill="#e8f3ff" fill-opacity=".22"><path d="M65 240v-87h37v87zm40 0v-59h29v59zm34 0V111h40v129zm43 0V160h32v80zm46 0v-102h46v102zm85 0v-83h37v83zm41 0v-108h36v108zm42 0V174h30v66z"/><path d="M285 240V86h22v154m-12-167v14m-4-5h12"/></g><g><path d="M85 74h205" stroke="white" stroke-opacity=".35" stroke-width="2" stroke-dasharray="5 7"/><path d="m274 48 39 15-37 12 2-10-44 3 41-16z" fill="white" fill-opacity=".75"/><circle cx="160" cy="122" r="28" fill="white" fill-opacity=".18"/><path d="M160 107a12 12 0 0 0-12 12c0 9 12 22 12 22s12-13 12-22a12 12 0 0 0-12-12z" fill="white"/><circle cx="160" cy="119" r="4" fill="#2a74e3"/></g></svg></div></div>`}
function searchPanel(){return `<div class="searchpanel"><div class="searchhead"><div class="modegroup"><button class="modebtn ${state.mode==='stay'?'active':''}" data-mode="stay">🛏 &nbsp;${t('Start with a Stay','숙소로 시작')}</button><button class="modebtn ${state.mode==='clinic'?'active':''}" data-mode="clinic">✚ &nbsp;${t('Start with a Clinic','병원으로 시작')}</button></div><div class="hint">${t('Station = search area · Selected place = walking origin','역 = 검색 지역 · 선택한 장소 = 이동 출발점')}</div></div><div class="searchinputs">${searchSelect()}<input id="searchWord" value="${esc(state.query)}" class="field keyword" placeholder="${t('Search clinics, hotels or beauty services','병원, 숙소, 뷰티 서비스 검색')}"/><button id="searchGo" class="primarybtn searchaction">⌕ &nbsp;${t('Search','검색')}</button></div>${state.mode==='clinic'?`<div class="featurelist mt8" style="margin-top:12px">${[['all','All clinics'],['dental','Dental'],['derma','Dermatology'],['plastic','Plastic surgery']].map(([k,l])=>`<button class="filterpill ${state.specialty===k?'on':''}" data-specialty="${k}">${l}</button>`).join('')}</div>`:''}</div>`}
function backgroundMap(){let stroke='#ffffff';let paths=[];for(let i=-200;i<900;i+=48){paths.push(`<path d="M${i},-90 L${i+315},600" stroke="${stroke}" stroke-width="12" opacity=".9"/><path d="M${i},-80 L${i+315},610" stroke="#d0dfed" stroke-width="1"/>`)}for(let i=-200;i<900;i+=57){paths.push(`<path d="M-70,${i} L900,${i-205}" stroke="${stroke}" stroke-width="11" opacity=".85"/>`)}return `<svg class="maproads" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid slice"><rect width="760" height="430" fill="#e6eff6"/><path d="M0 0h340L170 155 0 155z" fill="#d2edcd"/><path d="M570 0h190v130l-94 53-145-70z" fill="#d2edcd"/><path d="M0 325q160-35 280 45l90 60H0z" fill="#d7ebd4"/><path d="M450 430q90-115 310-95v95z" fill="#b4ddf6"/>${paths.join('')}<path d="M470-20C515 80 540 195 595 238S700 330 800 305" stroke="#c1d0e3" stroke-width="31" fill="none" opacity=".5"/></svg>`}
function searchOverview(){return `<div class="sectionhead"><div><h2>${t('Discover places around your chosen base','선택 거점 주변 인프라 검색')}</h2><p>${t('Explore a location, select a clinic or stay, then see walking times from that place.','장소를 선택하면 그곳을 출발점으로 주변 시설과 도보 시간을 표시합니다.')}</p></div><span class="section-tag">${t('Interactive map demo','클릭 가능한 지도 시안')}</span></div><div class="workspace"><div class="mapcard"><div class="maptop"><div><strong>⌖ &nbsp;${t('Map around','검색 지역')} ${esc(stationName(state.station))}</strong><div class="subtle">${t('Illustrative street map, not Google Maps','실제 구글 지도 연동 전의 예시 지도')}</div></div><span class="badge">${state.anchor?t('Base selected','거점 선택됨'):t('Choose a base','거점 선택')}</span></div><div class="mapwrap" aria-label="Interactive example map">${backgroundMap()}<div class="map-shade"></div>${items().filter(p=>!state.anchor||state.filters.has(p.type)||p.id===state.anchor).map(p=>`<button class="map-mark mapmark-${p.type} ${state.anchor===p.id?'selected':''}" style="left:${p.x}%;top:${p.y}%" data-anchor="${p.id}" title="${esc(p.name)}"><span class="pinicon">${p.emoji}</span><span class="pintxt">${esc(placeName(p))}</span></button>`).join('')}</div><div class="mapbottom"><div class="anchorlabel"><span class="av">⌖</span><span>${state.anchor?`${t('Selected base','선택 거점')}: ${esc(placeName(find(state.anchor)))}`:t('No base selected — choose a marker or card','거점 미선택 — 지도 핀이나 목록을 선택하세요')}</span></div><span class="maplegend">${t('Demo walking times are illustrative, not route API results.','도보 시간은 시연용 추정치이며 실제 경로 API 값이 아닙니다.')}</span></div></div><div class="resultcard"><div class="results-top"><div><strong>${state.anchor?t('Nearby your selected base','선택 거점 주변 시설'):state.mode==='clinic'?t('Choose a clinic','병원을 선택하세요'):t('Choose a stay','숙소를 선택하세요')}</strong><div class="subtle">${state.anchor?`${esc(placeName(find(state.anchor)))} · ${esc(stationName(state.station))}`:esc(stationName(state.station))}</div></div><span class="badge">${state.anchor?neighbors().length:baseResults().length} ${t('places','곳')}</span></div>${state.anchor?`<div class="filterbar">${[['clinic','Clinics'],['stay','Hotels'],['hair','Hair'],['beauty','Beauty'],['activity','Experiences']].map(([id,l])=>`<button class="filterpill ${state.filters.has(id)?'on':''}" data-filter="${id}">${l}</button>`).join('')}<button class="filterpill" id="clearAnchor">↶ ${t('Reset','초기화')}</button></div>`:`<div class="callout" style="margin:10px 13px;padding:9px 13px">${t('Tap <b>Set as base</b> to reveal nearby places and walking-time estimates.','<b>거점으로 선택</b>을 누르면 주변 장소 및 도보 시간을 표시합니다.')}</div>`}<div class="resultslist">${state.anchor?neighborsHtml():baseHtml()}</div></div></div>`}
function placeCard(p,dist){let active=state.anchor===p.id;return `<div class="place ${active?'selected':''}"><div class="placepic pic-${p.type}">${p.emoji}</div><div class="placebody"><div class="placename">${esc(placeName(p))}${p.featured?'<span class="badge" style="font-size:9px">Featured Partner</span>':''}</div><div class="placehint">${typeLabel(p)}${dist?` &nbsp;•&nbsp; <b>${dist.m.toLocaleString()}m · ${dist.walk} min walk</b> <span style="font-size:9px">(demo)</span>`:''}</div><div class="placeactions"><button data-anchor="${p.id}" class="strong">⌖ ${t('Set as base','거점 선택')}</button><button data-detail="${p.id}">${t('Details','상세보기')} ›</button></div></div></div>`}
function baseHtml(){let a=baseResults();return a.length?a.map(p=>placeCard(p)).join(''):`<div class="empty"><div class="big">⌕</div><strong>${t('No matching places','검색 결과가 없습니다')}</strong><div>${t('Try another specialty or keyword.','검색 조건을 변경하세요.')}</div></div>`}
function neighborsHtml(){let a=neighbors();return a.length?a.map(o=>placeCard(o.p,o.dist)).join(''):`<div class="empty"><div class="big">⌖</div><strong>${t('No visible categories','표시할 업종이 없습니다')}</strong><div>${t('Enable one of the filters above.','위에서 업종을 선택하세요.')}</div></div>`}
function features(){return `<div class="sectionhead"><div><h2>${t('Everything connected to your trip','의료부터 여행까지 한 번에')}</h2><p>${t('A guided experience instead of searching across many separate sites.','여러 사이트에서 직접 검색하지 않고 하나의 흐름에서 계획합니다.')}</p></div></div><div class="threecol"><div class="whitecard"><div class="feature-icon">🩺</div><h3>${t('Consult before you fly','출국 전 무료 상담')}</h3><p>${t('Submit a question, a short video or documents for clinic review. No AI diagnoses.','문의글·영상·진료기록으로 의료진에게 사전 상담을 신청합니다.')}</p><button class="outlinebtn sm" data-page="consult">${t('Explore consultation','상담 기능 보기')} →</button></div><div class="whitecard"><div class="feature-icon">✧</div><h3>${t('AI-powered trip planning','AI 여행 자동 설계')}</h3><p>${t('Enter a budget, station, dates and walking preferences for a draft itinerary.','예산·지역·기간·도보 조건을 입력하면 AI 여행 설계를 시연합니다.')}</p><button class="outlinebtn sm" data-page="planner">${t('Try AI planner','AI 설계 시작')} →</button></div><div class="whitecard"><div class="feature-icon">🛍</div><h3>${t('Book through travel partners','4개 제휴 플랫폼 연결')}</h3><p>Trip.com · Agoda · Klook · Creatrip<br>${t('Partner links and commission states are shown separately.','제휴 링크와 정산 상태는 별도로 관리합니다.')}</p><button class="outlinebtn sm" data-page="partners">${t('View partners','제휴사 보기')} →</button></div></div>`}
function explore(){return `${hero()}${searchPanel()}${searchOverview()}<div class="mt22"><div class="routebar">✚ ${t('Free consultation','무료 상담')} &nbsp; → &nbsp; ⌖ ${t('Choose a base','거점 선택')} &nbsp; → &nbsp; ✧ ${t('AI plan','AI 일정')} &nbsp; → &nbsp; 🛏 ${t('Partner booking','제휴 예약')}</div></div>${features()}`}
function consult(){return `<div class="sectionhead"><div><span class="kicker">BEAUTYPASS · CONSULTATIONS</span><h2 style="font-size:31px;margin:7px 0 6px">${t('Get a free clinic consultation before you travel','여행 전 병원 무료 상담')}</h2><p>${t('Send a written inquiry, photo, short video or medical record for review by a participating medical institution.','진료 문의·영상·사진·진료기록을 제출하고 의료기관의 검토 및 답변을 받는 기능입니다.')}</p></div><span class="section-tag">DEMO FLOW</span></div><div class="visitlayout"><div class="formcard"><div class="callout warning"><strong>${t('Prototype only — no medical information is transmitted or stored.','시연 전용 — 의료자료는 전송하거나 저장하지 않습니다.')}</strong><br>${t('Use fictional sample data only. Real intake requires a secured backend, consent, access controls and a verified clinic workflow.','실제 환자정보를 입력하지 마세요. 실서비스에는 보안 서버·동의·접근통제가 필요합니다.')}</div><form id="consultForm" class="mt22"><div class="formgrid"><div class="formgroup"><label>${t('Medical specialty','진료 분야')} *</label><select class="field" name="specialty" id="consultSpecialty" required><option value="dental">Dental</option><option value="derma">Dermatology</option><option value="plastic">Plastic surgery</option></select></div><div class="formgroup"><label>${t('Preferred clinic','희망 병원')} *</label><select class="field" name="clinic" id="consultClinic" required>${ALL.filter(p=>p.type==='clinic').map(p=>`<option value="${p.id}" ${p.id==='upenn'?'selected':''}>${esc(placeName(p))}${p.featured?' · Featured':''}</option>`).join('')}</select></div><div class="formgroup"><label>${t('Contact email (fictional only)','이메일 (가상값만 입력)')} *</label><input class="field" name="email" placeholder="demo@example.com" type="email" required/></div><div class="formgroup"><label>${t('Country of residence','거주 국가')} *</label><select class="field" name="country" required><option value="US">United States</option><option value="GB">United Kingdom</option><option value="AU">Australia</option><option value="CA">Canada</option><option value="JP">Japan</option><option value="Other">Other</option></select></div><div class="formgroup"><label>${t('Planned travel date','방문 예정일')}</label><input type="date" class="field" name="date"/></div><div class="formgroup"><label>${t('Preferred language','선호 언어')}</label><select class="field" name="language"><option value="en">English</option><option value="ko">Korean</option><option value="ja">Japanese</option></select></div></div><div class="formgroup"><label>${t('Your question','문의 내용')} *</label><textarea class="field" name="message" required placeholder="${t('For this demo, enter a fictional request, not your real symptoms or medical history.','실제 증상·진료기록 대신 가상의 문의 내용을 입력해 주세요.')}"></textarea><div class="formhelp">${t('Medical consultation is completed by clinic staff, not an AI diagnostic tool.','의료적 답변은 AI가 아닌 의료기관에서 제공합니다.')}</div></div><div class="formgroup"><label>${t('Optional attachments — filename preview only','첨부파일 — 이름만 확인 (실제 업로드 없음)')}</label><div class="dashed">📎 <input type="file" multiple id="consultFiles" accept="image/*,video/mp4,application/pdf"/><span class="muted" style="font-size:10px">PDF · JPG · PNG · MP4</span></div><div class="formhelp" id="fileHint">${t('No files leave your browser. 30-second video suggested.','첨부파일은 브라우저에서 전송되지 않습니다. 영상은 30초 이내 권장.')}</div></div><label class="checkline"><input type="checkbox" required name="demoConsent"/> ${t('I understand this is a fictional product demo. No actual consultation will be requested.','이 화면은 시연용이며 실제 상담이 신청되지 않음을 이해했습니다.')}</label><button class="primarybtn" type="submit">${t('Preview request submission','상담 신청 시연')} →</button></form>${state.consultStatus?`<div class="callout mt22"><strong>${esc(state.consultStatus)}</strong><br>${t('Sample workflow: Submitted → Assigned → Under review → Answered. No email was sent.','예시 업무 흐름: 접수 → 배정 → 검토중 → 답변완료. 실제 메일은 발송되지 않았습니다.')}</div>`:''}</div><aside><div class="whitecard"><span class="kicker">HOW IT WORKS</span><h3>${t('Clinic-reviewed answers','의료기관 검토 후 답변')}</h3>${[['01',t('Send inquiry / sample files','문의글 / 자료 접수')],['02',t('Clinic receives assigned request','의료기관 배정')],['03',t('Doctor / clinic team reviews','의료진 검토')],['04',t('Response and possible next steps','답변 및 예약 안내')]].map(x=>`<div class="faqrow"><b>${x[0]} &nbsp; ${x[1]}</b></div>`).join('')}<div class="callout mt22"><strong>${t('Indicative estimates only','견적은 참고용')}</strong><br>${t('Final diagnosis and treatment fees require clinical examination.','최종 진단 및 비용은 실제 진료 후 확정됩니다.')}</div></div><div class="whitecard mt16"><div class="feature-icon">🏥</div><h3>UPenn Bareun Dental Clinic</h3><p>${t('Featured dental partner in BeautyPass. The real clinic partnership and consultation process must be verified before launch.','유펜바른치과 우선 추천 파트너. 정식 오픈 전 실제 상담 운영 절차 확인이 필요합니다.')}</p><span class="badge">Featured Partner</span></div></aside></div>`}
function extractPrompt(){const val=state.planPrefs.prompt;let m=val.match(/([\d,.]+)\s*(?:만\s*원|만원)/);if(m)state.planPrefs.budget=Math.round(parseFloat(m[1].replace(',',''))*10000);let won=val.match(/(?:₩|KRW\s*)([\d,]+)/i);if(won)state.planPrefs.budget=parseInt(won[1].replaceAll(',',''),10)||state.planPrefs.budget;let nights=val.match(/(\d+)\s*(?:박|nights?)/i);if(nights)state.planPrefs.nights=Math.min(20,Math.max(1,Number(nights[1])));if(/강남|Gangnam/i.test(val))state.planPrefs.station='gangnam';else if(/잠실|Jamsil/i.test(val))state.planPrefs.station='jamsil';else if(/홍대|Hongdae/i.test(val))state.planPrefs.station='hongdae';else if(/종로|Jongno/i.test(val))state.planPrefs.station='jongno';if(/피부|skin|derm/i.test(val))state.planPrefs.specialty='derma';else if(/치과|dental|teeth/i.test(val))state.planPrefs.specialty='dental';else if(/성형|plastic surgery/i.test(val))state.planPrefs.specialty='plastic';let wm=val.match(/(?:도보|walk(?:ing)?(?: within)?)\s*(\d+)\s*(?:분|min)/i)||val.match(/(\d+)\s*(?:분|minutes?)\s*(?:이내|walk)/i);if(wm)state.planPrefs.walk=Number(wm[1]);}
function generatePlan(){let pref=state.planPrefs;let clinics=ALL.filter(p=>p.station===pref.station&&p.type==='clinic'&&p.specialty===pref.specialty);let clinic=clinics.find(p=>p.featured)||clinics[0]||ALL.find(p=>p.station===pref.station&&p.type==='clinic');let hotels=ALL.filter(p=>p.station===pref.station&&p.type==='stay').map(p=>({...p,dist:calcDist(clinic,p)})).sort((a,b)=>a.dist.walk-b.dist.walk);let valid=hotels.filter(h=>h.dist.walk<=pref.walk);let selected=valid[0]||hotels[0];let nightly=125000,transfer=pref.includeTransfer?68000:0,beauty=pref.includeBeauty?85000:0,hotelCost=nightly*pref.nights;let total=hotelCost+transfer+beauty;state.plan={clinic,hotels,selected,nightly,hotelCost,transfer,beauty,total,under:pref.budget>=total,unconfirmed:t('All prices are demo planning assumptions, NOT current booking offers. Medical fees are unconfirmed and excluded.','모든 금액은 시연용 가정이며 실제 예약 가격이 아닙니다. 의료비는 미확정으로 제외했습니다.'),generated:new Date().toLocaleString()};state.page='planner';eventLog('ai_plan_generated',`${pref.station}, ${amount(pref.budget)}`);updateHash();render();}
function planner(){let p=state.plan;let pref=state.planPrefs;return `<div class="sectionhead"><div><span class="kicker">BEAUTYPASS AI PLANNER · MVP SIMULATION</span><h2 style="font-size:30px;margin:7px 0 7px">${t('Tell us your trip. We plan the details.','원하는 조건을 입력하면 여행을 설계합니다.')}</h2><p>${t('Your clinic, budget and walking preferences become one connected itinerary.','병원·예산·도보 조건을 반영하여 숙소·교통·뷰티 일정을 추천합니다.')}</p></div><span class="section-tag">✧ ${t('AI planning demo','AI 설계 시연')}</span></div><div class="planner-layout"><div class="formcard"><span class="kicker">01 · YOUR REQUEST</span><h3 style="font-size:20px;margin:10px 0">${t('Describe your ideal Seoul trip','여행 계획을 문장으로 입력하세요')}</h3><textarea class="field" id="planPrompt" style="min-height:127px;resize:vertical">${esc(pref.prompt)}</textarea><button id="parsePrompt" class="softbtn sm mt8">✧ ${t('Extract conditions from my request','문장에서 조건 추출')}</button><div class="callout mt16"><strong>${t('Confirm and edit the conditions below.','아래 조건을 확인하고 수정할 수 있습니다.')}</strong><br>${t('The prototype uses keyword parsing and sample inventory. It is not a live LLM or real-time travel search.','현재 시안은 키워드 분석과 예시 상품을 사용하며 실제 LLM/실시간 검색이 아닙니다.')}</div><div class="formgrid mt22"><div class="formgroup"><label>${t('Destination station','희망 지역 / 역')}</label><select class="field" data-pref="station">${STATIONS.map(s=>`<option value="${s.id}" ${pref.station===s.id?'selected':''}>${esc(s.en)}</option>`).join('')}</select></div><div class="formgroup"><label>${t('Medical specialty','진료 분야')}</label><select class="field" data-pref="specialty"><option value="dental" ${pref.specialty==='dental'?'selected':''}>Dental</option><option value="derma" ${pref.specialty==='derma'?'selected':''}>Dermatology</option><option value="plastic" ${pref.specialty==='plastic'?'selected':''}>Plastic surgery</option></select></div><div class="formgroup"><label>${t('Total travel budget (KRW)','총 예산 (원)')}</label><input class="field" data-pref="budget" type="number" min="100000" max="100000000" step="100000" value="${pref.budget}"/></div><div class="formgroup"><label>${t('Nights in Seoul','숙박 일수')}</label><input class="field" data-pref="nights" type="number" min="1" max="20" value="${pref.nights}"/></div><div class="formgroup"><label>${t('Max walk from clinic (min)','병원에서 도보 허용 시간(분)')}</label><input class="field" data-pref="walk" type="number" min="2" max="60" value="${pref.walk}"/></div><div class="formgroup"><label>${t('Travelers','여행 인원')}</label><input class="field" data-pref="people" type="number" min="1" max="10" value="${pref.people}"/></div></div><label class="checkline"><input type="checkbox" data-pref-check="includeTransfer" ${pref.includeTransfer?'checked':''}/> ${t('Include illustrative airport transfer budget','공항 픽업 예상 비용 포함')}</label><label class="checkline"><input type="checkbox" data-pref-check="includeBeauty" ${pref.includeBeauty?'checked':''}/> ${t('Include illustrative beauty service budget','뷰티 서비스 예상 비용 포함')}</label><label class="checkline"><input type="checkbox" data-pref-check="includeMedical" ${pref.includeMedical?'checked':''}/> ${t('I want to track medical cost as unconfirmed (not added to total)','의료비를 미확정 비용으로 표시 (합산하지 않음)')}</label><button id="generatePlan" class="primarybtn" style="width:100%;margin-top:12px">✧ ${p?t('Regenerate my trip','일정 다시 설계'):t('Generate my trip','AI 여행 일정 만들기')}</button></div><div class="planner-results">${p?planResult(p):`<div class="whitecard"><div style="height:190px;border-radius:14px;background:linear-gradient(130deg,#e3edff,#e4faf8);display:grid;place-items:center;color:#3b68c9;font-size:65px">✧</div><h3>${t('Your custom plan will appear here','AI 맞춤 여행 계획이 여기에 표시됩니다.')}</h3><p>${t('Start with the sample prompt and generate an itinerary. Then change your budget, station or walking-time limit and regenerate.','예시 문장을 이용해 일정을 생성하고 예산·역·도보 시간을 바꾸어 다시 설계해 보세요.')}</p><div class="featurelist"><span>${t('Clinic first','병원 우선')}</span><span>${t('Walking distance','도보 거리')}</span><span>${t('Budget-aware','예산 고려')}</span><span>${t('Booking connections','예약 연결')}</span></div></div>`}</div></div>`}
function planResult(p){const pref=state.planPrefs;return `<div class="whitecard"><div class="space"><span class="kicker">02 · YOUR DRAFT ITINERARY</span><span class="badge badgewarn">ILLUSTRATIVE</span></div><h3 style="font-size:21px">${t('Seoul medical & beauty escape','서울 의료·뷰티 여행 맞춤 일정')}</h3><p>${esc(stationName(pref.station))} · ${pref.nights} ${t('nights','박')} · ${pref.people} ${t('traveler(s)','명')} · ${t('Clinic-first planning','병원 중심 설계')}</p><div class="callout"><strong>⌖ ${t('Selected base','선택 거점')}: ${esc(placeName(p.clinic))}</strong><br>${t('The hotel recommendations below are measured relative to this clinic, not the station.','숙소 도보 시간은 역이 아니라 선택된 병원을 기준으로 한 시연용 추정치입니다.')}</div><div class="space mt16"><span>${t('Illustrative nonmedical cost','의료비 제외 예시 예상비용')}</span><span class="moneybig">${amount(p.total)}</span></div><div class="budgetbar"><div class="budgetfill ${!p.under?'over':''}" style="width:${Math.min(100,Math.round(p.total/pref.budget*100))}%"></div></div><div class="space" style="font-size:12px"><span class="muted">${t('Budget','예산')} ${amount(pref.budget)}</span><strong style="color:${p.under?'#189d84':'#c46b53'}">${p.under?t('Within sample budget','예산 범위 내'):t('Above sample budget','예산 초과')} · ${amount(Math.abs(pref.budget-p.total))}</strong></div><div class="moneyrow"><span class="muted">${t('Example hotel','숙박 가정')} · ${pref.nights} nights × ${amount(p.nightly)}</span><strong>${amount(p.hotelCost)}</strong></div><div class="moneyrow"><span class="muted">${t('Airport transfer (sample)','공항 픽업 예시')}</span><strong>${amount(p.transfer)}</strong></div><div class="moneyrow"><span class="muted">${t('Beauty service (sample)','뷰티 서비스 예시')}</span><strong>${amount(p.beauty)}</strong></div><div class="moneyrow"><span class="muted">${t('Medical fee','진료비')}</span><strong>${t('Not confirmed','미확정')}</strong></div><div class="callout warning mt16"><strong>${t('Not a live quote','실시간 견적 아님')}</strong><br>${esc(p.unconfirmed)} ${!p.under?t('Reduce nights or optional services to lower the example total.','숙박 일수나 선택 서비스를 줄여 예산을 조정하세요.'):''}</div></div><div class="whitecard"><div class="space"><h3 style="margin:0">${t('Hotels around your chosen clinic','선택 병원 주변 숙소')}</h3><span class="badge">DEMO ROUTES</span></div><p>${t('Sorted by example walk time from the clinic. Real prices are checked on partner sites.','선택 병원 기준 도보 시간 순. 실제 예약 금액은 제휴사에서 확인합니다.')}</p>${p.hotels.map((h,i)=>`<div class="place" style="padding:9px 2px"><div class="placepic pic-stay">🏨</div><div class="placebody"><div class="placename">${esc(h.name)} ${h.id===p.selected.id?'<span class="badge">Closest match</span>':''}</div><div class="placehint">${h.dist.m}m · ${h.dist.walk} min walk <b>(demo)</b> · ${t('Price check at partner','제휴사에서 가격 확인')}</div><div class="placeactions"><button data-book="trip" data-book-type="stay">Trip.com ↗</button><button data-book="agoda" data-book-type="stay">Agoda ↗</button></div></div></div>`).join('')}</div><div class="whitecard"><h3>${t('Suggested itinerary','추천 일정')}</h3><div class="itineraryday"><div class="daytop">${t('Day 1 · Arrival & check-in','1일차 · 입국 및 체크인')}</div><div class="event"><span class="eventtime">AM / PM</span><span class="eventicon">✈</span><div class="eventbody"><strong>${t('Airport transfer','공항 픽업')}</strong><span>${t('Reserve with a verified travel partner','제휴 플랫폼에서 예약 정보 확인')}</span></div><button class="outlinebtn sm" data-book="klook" data-book-type="transfer">Klook ↗</button></div><div class="event"><span class="eventtime">PM</span><span class="eventicon">🛏</span><div class="eventbody"><strong>${esc(p.selected.name)}</strong><span>${p.selected.dist.walk} ${t('minute walk from clinic (demo)','분 도보 (시연)')}</span></div></div></div><div class="itineraryday"><div class="daytop">${t('Day 2 · Consultation / clinic','2일차 · 병원 상담 및 진료')}</div><div class="event"><span class="eventtime">TBD</span><span class="eventicon">✚</span><div class="eventbody"><strong>${esc(p.clinic.name)}</strong><span>${t('Clinic appointment must be confirmed by medical staff','의료기관이 진료 일정을 확인해야 합니다.')}</span></div><button class="outlinebtn sm" data-page="consult">${t('Consult','상담')}</button></div></div>${pref.includeBeauty?`<div class="itineraryday"><div class="daytop">${t('Flexible day · Optional beauty appointment','선택 일정 · 뷰티 서비스')}</div><div class="event"><span class="eventtime">TBD</span><span class="eventicon">✿</span><div class="eventbody"><strong>${t('Beauty / hair experience','헤어·뷰티 체험')}</strong><span>${t('Only if medically appropriate after treatment','시술 후 이용 가능 여부는 의료진 확인 필요')}</span></div><button class="outlinebtn sm" data-book="creatrip" data-book-type="beauty">Creatrip ↗</button></div></div>`:''}<div class="buttonrow mt16"><button class="outlinebtn sm" id="copyPlan">${t('Copy shareable demo parameters','시연 조건 복사')}</button><button class="outlinebtn sm" id="printPlan">${t('Print plan','일정 인쇄')}</button></div></div>`}
function partners(){return `<div class="sectionhead"><div><span class="kicker">FOUR PARTNERS · ONE EXPERIENCE</span><h2 style="font-size:30px;margin:7px 0 7px">${t('Travel services from four partners','초기 여행 RS 제휴 4개사')}</h2><p>${t('Accommodation, transfer, beauty and experiences — through existing booking providers.','숙박·픽업·뷰티·체험은 4개 여행 플랫폼 상품을 활용합니다.')}</p></div></div><div class="channelcards">${PROVIDERS.map(p=>`<div class="channel"><div class="providerlabel">TRAVEL PARTNER · DEMO</div><strong>${p.name}</strong><small>${p.about}</small><div class="featurelist" style="margin:10px 0 18px"><span>${p.tag}</span></div><button class="outlinebtn sm" data-book="${p.id}" data-book-type="general">${t('Visit provider','제휴사 방문')} ↗</button></div>`).join('')}</div><div class="twocol mt22"><div class="whitecard"><h3>${t('Booking integrations','예약 연동 원칙')}</h3><div class="faqrow"><b>01 · ${t('Start with approved deep links','승인된 딥링크 우선')}</b>${t('A public provider homepage is not an affiliate contract. Partner credentials are not configured in this demo.','일반 홈페이지 링크는 RS 계약이 아닙니다. 현재 데모에는 제휴 인증정보가 없습니다.')}</div><div class="faqrow"><b>02 · ${t('No false live price','가격 허위 표시 금지')}</b>${t('If price APIs are unavailable, show “Check price on partner”.','실시간 API 미연동 시 제휴사에서 최종 가격을 확인합니다.')}</div><div class="faqrow"><b>03 · ${t('Confirmed commissions only','확정 정산만 RS 매출')}</b>${t('Click events are not bookings or commissions.','링크 클릭만으로 확정 예약·수익이 발생하지 않습니다.')}</div></div><div class="whitecard"><h3>${t('Service coverage','서비스 운영 범위')}</h3>${[['Trip.com','Accommodation · Travel'],['Agoda','Accommodation'],['Klook','Airport transfers · Experiences'],['Creatrip','Hair · Beauty · Korean experiences']].map(([a,b])=>`<div class="faqrow"><b>${a}</b>${b}</div>`).join('')}<div class="callout mt16"><strong>${t('Medical interpretation','의료통역')}</strong><br>${t('A separate interpreter partner, Ellie, may receive 100% of interpretation fees under a service agreement. No BeautyPass RS is assumed.','엘리쌤과 별도 위탁 시 통역 매출은 파트너 100% 귀속으로 설계할 수 있습니다.')}</div></div></div>`}
function admin(){return `<div class="sectionhead"><div><span class="kicker">BACK OFFICE · DEMO ONLY</span><h2 style="font-size:31px;margin:7px 0 6px">${t('Operations dashboard','관리자 운영 대시보드')}</h2><p>${t('Demonstrates reporting, partner states and workflows. Real administration requires protected server accounts.','성과·제휴·상담 업무 흐름의 공개 시연입니다. 실서비스 관리자 기능에는 서버 인증이 필요합니다.')}</p></div><span class="pillnote">PUBLIC DEMO · NOT SECURE ADMIN</span></div><div class="statgrid"><div class="stat"><div class="stat-title">${t('Demo station searches','시연 검색')}</div><div class="num">${state.eventlog.filter(e=>e.type==='search_submitted').length}</div><small>LOCAL SESSION</small></div><div class="stat"><div class="stat-title">${t('Selected anchors','선택 거점')}</div><div class="num">${state.eventlog.filter(e=>e.type==='anchor_selected').length}</div><small>LOCAL SESSION</small></div><div class="stat"><div class="stat-title">${t('Affiliate outbound clicks','제휴 링크 클릭')}</div><div class="num">${state.clicks.length}</div><small>NOT SALES</small></div><div class="stat"><div class="stat-title">${t('Confirmed commission','확정 제휴 수익')}</div><div class="num">₩0</div><small>NO LIVE SETTLEMENT</small></div></div><div class="twocol mt22"><div class="whitecard"><h3>${t('Consultation workflow','상담 처리 상태')}</h3><div class="callout warning"><strong>${t('No real patient data in this public demo.','공개 데모에 실제 환자정보 없음')}</strong><br>${t('Clinic-only access, audit logging and encrypted uploads must be added on the server.','의료기관별 접근 분리·접근 로그·암호화는 실제 서버에서 구현해야 합니다.')}</div><div class="faqrow"><b>${t('Demo submissions this session','현재 세션 시연 상담 접수')}</b>${state.consultDemoCount}</div><div class="faqrow"><b>${t('Workflow states','상태 흐름')}</b>DRAFT → SUBMITTED → ASSIGNED → UNDER_REVIEW → ANSWERED → CLOSED</div></div><div class="whitecard"><h3>${t('Affiliate program readiness','4개 제휴사 연동 상태')}</h3><div class="tablewrap"><table class="data-table"><thead><tr><th>Provider</th><th>Category</th><th>Status</th></tr></thead><tbody>${PROVIDERS.map(x=>`<tr><td><strong>${x.name}</strong></td><td>${x.tag}</td><td><span class="badge badgewarn">Pending credentials</span></td></tr>`).join('')}</tbody></table></div></div></div><div class="whitecard mt22"><h3>${t('Session event log (non-sensitive)','시연 세션 이벤트 (민감정보 제외)')}</h3><div class="tablewrap"><table class="data-table"><thead><tr><th>${t('Event','이벤트')}</th><th>${t('Info','설명')}</th><th>${t('Time','시간')}</th></tr></thead><tbody>${state.eventlog.length?state.eventlog.map(e=>`<tr><td>${esc(e.type)}</td><td>${esc(e.info)}</td><td>${esc(e.time)}</td></tr>`).join(''):`<tr><td colspan="3">${t('No events yet. Explore the map or click a booking button.','이벤트 없음. 지도 또는 예약 버튼을 시험해 보세요.')}</td></tr>`}</tbody></table></div></div>`}
function about(){return `<div class="sectionhead"><div><span class="kicker">HOW BEAUTYPASS WORKS</span><h2 style="font-size:31px;margin:7px 0 6px">${t('One connected journey, from clinic to checkout','병원 선택부터 여행 계획까지 한 번에')}</h2><p>${t('The prototype maps the feature specification to interactive journeys.','기능정의서의 핵심 흐름을 실제 클릭으로 테스트할 수 있습니다.')}</p></div></div><div class="threecol"><div class="whitecard"><div class="feature-icon">⌖</div><h3>${t('01 · Choose your base','01 · 거점 선택')}</h3><p>${t('Search around a station but anchor walking estimates on the clinic or stay you actually select.','역은 지역 검색 조건이고 도보 시간은 실제 선택한 병원·숙소를 기준으로 합니다.')}</p><button class="outlinebtn sm" data-page="explore">${t('Try search','검색하기')}</button></div><div class="whitecard"><div class="feature-icon">✧</div><h3>${t('02 · AI builds your trip','02 · AI 일정 자동 설계')}</h3><p>${t('Enter dates, budget, specialty and walk-time preferences. Review a modifiable plan.','예산·진료분야·도보 조건을 입력하고 수정 가능한 여행 계획을 만듭니다.')}</p><button class="outlinebtn sm" data-page="planner">${t('Try planner','설계하기')}</button></div><div class="whitecard"><div class="feature-icon">🛍</div><h3>${t('03 · Book with partners','03 · 제휴사 예약 연결')}</h3><p>${t('Four travel partners handle their booking pages; BeautyPass tracks click and final settlement separately.','4개 여행사가 예약을 처리하며 클릭과 최종 수익은 별도로 관리합니다.')}</p><button class="outlinebtn sm" data-page="partners">${t('See partners','제휴사 보기')}</button></div></div><div class="whitecard mt22"><h3>${t('Live features vs. simulated features','실제 기능과 시연 기능 구분')}</h3><div class="tablewrap"><table class="data-table"><thead><tr><th>${t('Function','기능')}</th><th>${t('In this demo','시안 상태')}</th><th>${t('Production requirement','실서비스 필요 조건')}</th></tr></thead><tbody>${[['Mode/station filtering','Interactive','Verified clinic and hotel data'],['Anchor-based results','Interactive (sample geometry)','Google Places/Routes API'],['Walking minutes','Illustrative estimates','Real walking route matrix'],['Consultation intake','Local mock only','Secure uploads, consent, clinic accounts'],['AI itinerary','Rule-based demo','LLM + verified inventory + safety rules'],['Accommodation pricing','No live rates','Partner contracts and price API rights'],['Outbound booking','Provider homepage links','Affiliate deep links + approved attribution'],['Partner commission','Clicks only; ₩0 confirmed','Partner reporting / reconciliation'],['Admin dashboard','Public, local session preview','Authenticated backend + RBAC + audit']].map(([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td></tr>`).join('')}</tbody></table></div></div>`}
function detailModal(p){let a=find(state.anchor),dist=a&&a.id!==p.id?calcDist(a,p):null;return `<div class="modaloverlay" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Place details"><button class="closemodal" id="closeModal">✕</button><div class="modal-hero">${p.emoji}</div><span class="kicker">${typeLabel(p)} · ${stationName(p.station)}</span><h2 style="margin:10px 0;font-size:25px">${esc(placeName(p))}</h2>${p.featured?'<span class="badge">Featured Dental Partner · Sponsored placement</span>':''}<p style="margin:14px 0;color:#7687a0">${esc(p.description||'Illustrative listing used to demonstrate nearby-service discovery.')}</p><div class="twocol"><div class="callout"><strong>${t('Station area','지역')}</strong><br>${esc(stationName(p.station))}</div><div class="callout"><strong>${t('Walking origin','도보 거리 기준')}</strong><br>${dist?`${dist.m}m · ${dist.walk} min (demo)`:t('Choose a base to compare','거점 선택 후 비교')}</div></div><div class="callout warning mt16"><strong>${t('Example listing','예시 장소 정보')}</strong><br>${t('The names and positions are demo content, except the named featured clinic. No real routes, treatment fees or availability are represented.','실제 위치·진료 가능 여부·가격을 나타내지 않는 시연 정보입니다.')}</div><div class="buttonrow mt22"><button class="primarybtn" data-anchor="${p.id}" id="setFromDetail">⌖ ${t('Use as my base','이 장소를 거점으로')}</button>${p.type==='clinic'?`<button class="outlinebtn" data-page="consult">${t('Free consultation','무료 상담')} →</button>`:`<button class="outlinebtn" data-page="partners">${t('Booking options','예약 옵션')} →</button>`}</div></div></div>`}
function footer(){return `<footer class="foot"><span><strong>BeautyPass</strong> · Product concept by Lovers Planning · 2026</span><span>${t('Interactive prototype only. Sample listings, walking times and budgets are not live services.','인터랙티브 시안입니다. 장소·이동시간·요금은 실제 제공 정보가 아닙니다.')}</span></footer>`}
function render(){let html=renderTop()+`<div class="shell">${sidebar()}<main class="main"><div class="notice"><i class="dot"></i>${t('INTERACTIVE PRODUCT PROTOTYPE · NOT LIVE PRICES, ROUTES, MEDICAL ADVICE OR BOOKINGS','인터랙티브 제품 시안 · 실시간 가격·경로·의료상담·예약 기능 아님')}</div>${({explore,consult,planner,partners,admin,about})[state.page]()}${footer()}</main></div>`+(state.modal?detailModal(state.modal):'');document.getElementById('app').innerHTML=html;}
function goProvider(id,category){const p=PROVIDERS.find(x=>x.id===id);if(!p)return;state.clicks.push({provider:id,category,at:new Date()});eventLog('affiliate_outbound_demo',`${p.name} / ${category}`);toast(t(`${p.name}: opening public homepage (NOT an affiliate link).`,`제휴사 ${p.name} 일반 홈페이지로 이동합니다. RS 추적 링크가 아닙니다.`));window.open(p.url,'_blank','noopener,noreferrer');render();}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-mode],[data-anchor],[data-filter],[data-specialty],[data-detail],[data-book],#closeModal,#clearAnchor,#langToggle,#searchGo,#parsePrompt,#generatePlan,#copyPlan,#printPlan');if(!el)return;
 if(el.dataset.page){setPage(el.dataset.page);return;}
 if(el.dataset.mode){setMode(el.dataset.mode);return;}
 if(el.dataset.anchor){setAnchor(el.dataset.anchor);state.modal=null;return;}
 if(el.dataset.filter){const k=el.dataset.filter;state.filters.has(k)?state.filters.delete(k):state.filters.add(k);render();return;}
 if(el.dataset.specialty){state.specialty=el.dataset.specialty;state.anchor=null;render();return;}
 if(el.dataset.detail){state.modal=find(el.dataset.detail);render();return;}
 if(el.dataset.book){goProvider(el.dataset.book,el.dataset.bookType||'general');return;}
 if(el.id==='closeModal'){state.modal=null;render();return;}
 if(el.id==='clearAnchor'){state.anchor=null;state.selected=null;updateHash();render();return;}
 if(el.id==='langToggle'){state.lang=state.lang==='en'?'ko':'en';render();return;}
 if(el.id==='searchGo'){state.query=document.getElementById('searchWord')?.value.trim()||'';state.anchor=null;eventLog('search_submitted',`${state.station} ${state.mode} ${state.query}`);render();return;}
 if(el.id==='parsePrompt'){state.planPrefs.prompt=document.getElementById('planPrompt')?.value||'';extractPrompt();render();toast(t('Sample conditions extracted. Please review fields.','시연 조건이 추출되었습니다. 입력값을 확인해 주세요.'));return;}
 if(el.id==='generatePlan'){state.planPrefs.prompt=document.getElementById('planPrompt')?.value||'';generatePlan();return;}
 if(el.id==='copyPlan'){let params=`BeautyPass demo plan · ${stationName(state.planPrefs.station)} · ${state.planPrefs.nights} nights · ${amount(state.planPrefs.budget)} budget · ${state.planPrefs.walk}min walk (example values only)`;navigator.clipboard?.writeText(params).then(()=>toast(t('Demo plan conditions copied.','시연 조건을 복사했습니다.'))).catch(()=>toast(params));return;}
 if(el.id==='printPlan'){window.print();return;}
});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='stationSelect'){setStation(el.value);return;}if(el.dataset.pref){let k=el.dataset.pref;state.planPrefs[k]=['budget','nights','walk','people'].includes(k)?Number(el.value):el.value;return;}if(el.dataset.prefCheck){state.planPrefs[el.dataset.prefCheck]=el.checked;return;}if(el.id==='consultFiles'){let n=el.files?.length||0;let hint=document.getElementById('fileHint');if(hint)hint.textContent=`${n} file(s) selected locally. Nothing uploaded to a server.`;return;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render();}if(e.key==='Enter'&&e.target.id==='searchWord'){e.preventDefault();document.getElementById('searchGo')?.click();}});
document.addEventListener('submit',e=>{if(e.target.id!=='consultForm')return;e.preventDefault();let f=e.target;let consent=f.querySelector('input[name="demoConsent"]');if(!consent.checked){toast(t('Please acknowledge demo-only consent.','시연 전용 동의를 확인해 주세요.'));return;}state.consultDemoCount++;state.consultStatus=`Demo request BP-DEMO-${String(state.consultDemoCount).padStart(3,'0')} · SUBMITTED (local preview only)`;eventLog('consultation_submitted_demo','Fictional form — no patient data saved');render();toast(t('Demo request created in this browser session. No message or file was sent.','현재 브라우저에서만 시연 접수되었습니다. 의료자료나 이메일은 전송되지 않았습니다.'));});
window.addEventListener('hashchange',()=>{initHash();render()});initHash();render();
</script></body></html>
